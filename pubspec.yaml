name: fotoly_mobile
description: "Fotoly mobile backup app — secure photos to fotoly.eu"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  http: ^1.2.2
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  path: ^1.9.1
  file_picker: ^13.3.0
  path_provider: ^2.1.5
  permission_handler: ^13.0.0
  crypto: ^3.0.7
  cached_network_image: ^4.0.3
  flutter_cache_manager: ^3.4.1
  image: ^4.8.0
  url_launcher: ^6.3.2
  app_links: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  file: ^7.0.1

# Generate launcher icons: dart run flutter_launcher_icons
# Master: assets/brand/fotoly-app-icon.png (1024, Fotoly mark on #081C37).
# Inset 16% keeps the f-tail inside Android's circular mask.
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/brand/fotoly-app-icon.png
    background_color: "#081C37"
    theme_color: "#0F172A"
  image_path: assets/brand/fotoly-app-icon.png
  adaptive_icon_background: "#081C37"
  adaptive_icon_foreground: assets/brand/fotoly-app-icon.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  background_color_ios: "#081C37"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/pixelfox-logo.png
    - assets/brand/pixelfox-logo-32.png
    - assets/brand/fotoly-logo.png
    - assets/brand/fotoly-logo-32.png
    - assets/brand/fotoly-app-icon.png
    - assets/brand/source-app-icon.png
